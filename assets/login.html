<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REEBJAI Admin — Login</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --red: #dc2626; --red-hover: #b91c1c; --red-light: #fef2f2;
      --red-border: #fecaca; --bg: #f8fafc; --white: #ffffff;
      --text: #111827; --text-2: #6b7280; --text-3: #9ca3af;
      --border: #e5e7eb; --radius-sm: 8px; --radius-lg: 20px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 40%, #dc2626 100%);
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(circle, #fff 1.5px, transparent 1.5px);
      background-size: 24px 24px; opacity: 0.04; pointer-events: none;
    }
    ion-icon { pointer-events: none; }
    .icon-sm { font-size: 14px; }
    .icon-xl { font-size: 38px; }
    .login-card {
      background: var(--white); padding: 40px 32px; border-radius: var(--radius-lg);
      width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative; z-index: 10;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .login-logo {
      width: 64px; height: 64px; background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px; box-shadow: 0 8px 24px rgba(220,38,38,0.35);
    }
    .login-card h1 { color: var(--text); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .login-card .login-sub { color: var(--text-2); font-size: 13.5px; margin: 6px 0 28px; }
    .input-group { margin-bottom: 14px; }
    .login-card input {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14.5px; transition: all 0.2s; outline: none;
    }
    .login-card input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
    .login-btn {
      width: 100%; background: var(--red); color: white; border: none; padding: 12px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(220,38,38,0.35);
    }
    .login-btn:hover { background: var(--red-hover); transform: translateY(-1px); }
    .login-hint {
      color: var(--text-2); background: var(--bg); padding: 10px; border-radius: var(--radius-sm);
      font-size: 12.5px; margin-top: 18px; border: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .swal-font { font-family: 'Sarabun', sans-serif !important; }
    @media (max-width: 480px) { .login-card { padding: 32px 24px; max-width: 90vw; } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <ion-icon name="shield-checkmark" class="icon-xl" style="color:white;"></ion-icon>
    </div>
    <h1>REEBJAI Admin</h1>
    <p class="login-sub">เข้าสู่ระบบเพื่อจัดการร้านค้า</p>
    <div class="input-group">
      <input type="text" id="username" placeholder="Username" autocomplete="off">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button class="login-btn" onclick="doLogin()">
      <ion-icon name="log-in-outline" class="icon-sm"></ion-icon>
      เข้าสู่ระบบ
    </button>
    <div class="login-hint">
      <ion-icon name="bulb-outline" class="icon-sm"></ion-icon>
      Default: admin / 1234
    </div>
  </div>

  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = '1234';
    if (sessionStorage.getItem('reebjai_admin') === 'true') { window.location.href = 'qr-barcode.html'; }

    const Toast = Swal.mixin({
      toast: true, position: 'bottom-end',
      showConfirmButton: false, timer: 2800, timerProgressBar: true,
      customClass: { popup: 'swal-font' }
    });

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) { Toast.fire({ icon: 'warning', title: 'กรุณากรอกข้อมูลให้ครบถ้วน' }); return; }
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem('reebjai_admin', 'true');
        window.location.href = 'qr-barcode.html';
      } else {
        document.getElementById('password').value = '';
        Toast.fire({ icon: 'error', title: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' });
      }
    }

    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
